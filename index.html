<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Rolando</title>

<style>
body {
    margin: 0;

    font-family: 'Segoe UI', sans-serif;
    background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),

    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.box {
    background: rgba(255,255,255,0.92);
    color: #333;
    padding: 25px;
    border-radius: 15px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

button {
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    border: none;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    transform: scale(1.05);
}

input {
    padding: 10px;
    width: 80%;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    text-align: center;
}

.error {
    color: red;
    margin-top: 10px;
    display: none;
}
</style>
</head>

<body>
